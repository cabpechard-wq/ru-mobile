name: Build iOS (EAS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require Play branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/claude/google-play-first-publish-qrs8mu" ]; then
            echo "Build iOS production : choisir la branche claude/google-play-first-publish-qrs8mu (actuel : ${GITHUB_REF})."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS app
        run: eas build --platform ios --profile production --non-interactive --wait
